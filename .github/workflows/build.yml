name: Build Geode Mod (Windows Only)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 'latest'
          combine: true
          target: Win64

  package:
    name: Package .geode
    runs-on: ubuntu-latest
    needs: ["build"]
    if: ${{ !cancelled() }}

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PredictiveBuffer-Windows
          path: ${{ steps.build.outputs.build-output }}
